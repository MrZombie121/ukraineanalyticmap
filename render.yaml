services:
  - type: static_site
    name: fronty-map
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: ""
    staticPublishPath: .
    headers:
      # Щоб браузер НЕ стискав вже стислий KMZ
      - path: /Ukraine Analystic Map UAM.kmz
        name: Content-Type
        value: application/vnd.google-earth.kmz
      - path: /Ukraine Analystic Map UAM.kmz
        name: Cache-Control
        value: no-store, max-age=0
      - path: /front.kmz
        name: Content-Type
        value: application/vnd.google-earth.kmz
      - path: /front.kml
        name: Content-Type
        value: application/vnd.google-earth.kml+xml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html